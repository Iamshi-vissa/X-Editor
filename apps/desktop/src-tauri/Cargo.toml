[package]
name = "x-editor"
version.workspace = true
description = "X-Editor: a fast, customisable code editor that grows into an IDE"
edition.workspace = true
license.workspace = true

[lib]
name = "x_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
log.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt", "macros"] }
xe-fs = { path = "../../../crates/xe-fs" }
xe-term = { path = "../../../crates/xe-term" }
xe-git = { path = "../../../crates/xe-git" }
xe-auth = { path = "../../../crates/xe-auth" }
xe-lsp = { path = "../../../crates/xe-lsp" }
xe-runtime = { path = "../../../crates/xe-runtime" }
xe-config = { path = "../../../crates/xe-config" }
